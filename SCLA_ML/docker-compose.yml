services:

  vuln-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SCLA_ML_vuln_scanner
    ports:
      - "11434:11434"       
    volumes:
      - ollama_data:/root/.ollama   
    environment:
      - OLLAMA_HOST=0.0.0.0         
      - OLLAMA_NUM_PARALLEL=1       
      - OLLAMA_MAX_LOADED_MODELS=1  
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu] 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ollama_data: